<!doctype html>
<html lang="fr" class="bg-slate-950">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Malo OneWeb · Avis & contact</title>
<meta name="description" content="Laissez un avis Google à Malo OneWeb, enregistrez son contact ou appelez-le en un clic.">
<meta name="theme-color" content="#020617">
<meta name="robots" content="noindex">
__ICONS__
<style>__CSS__</style>
</head>
<body class="min-h-screen bg-slate-950 text-white antialiased font-sans">
<div class="glow" aria-hidden="true"></div>
<main class="relative mx-auto flex min-h-screen max-w-sm flex-col justify-center px-4 py-8">
  <section class="rise rounded-3xl border border-slate-800 bg-slate-900 p-6 shadow-2xl shadow-black/60">

    <!-- 1. En-tête -->
    <header class="text-center">
      <div class="mx-auto mb-4 grid h-24 w-24 place-items-center rounded-full bg-gradient-to-br from-blue-500 to-sky-400 p-[3px]">
        <div class="grid h-full w-full place-items-center rounded-full bg-slate-950">
          <svg class="w-14" viewBox="0 0 310 210" role="img" aria-label="Logo Malo OneWeb">__SYMBOL__</svg>
        </div>
      </div>
      <h1 class="text-2xl font-bold tracking-tight">Malo OneWeb</h1>
      <p class="mt-1 text-sm text-slate-400">Accompagnement web &amp; solutions digitales · Occitanie</p>
      <a id="badge" href="#" target="_blank" rel="noopener" class="mt-4 inline-flex items-center gap-2 rounded-full border border-slate-800 bg-slate-950/60 px-3 py-1.5 text-xs text-slate-300">
        <span class="text-amber-400 tracking-[2px]" aria-hidden="true">★★★★★</span>
        <span id="badgeTxt">Avis Google</span>
      </a>
    </header>

    <!-- 2. CTA principal -->
    <a id="review" href="#" target="_blank" rel="noopener" class="cta group mt-6 flex items-center gap-3 rounded-2xl bg-gradient-to-r from-blue-600 to-sky-500 p-4 font-semibold shadow-lg shadow-blue-600/30 transition active:scale-[.98]">
      <span class="grid h-10 w-10 shrink-0 place-items-center rounded-full bg-white">
        <svg class="h-5 w-5" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3z"/><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z"/><path fill="#FBBC05" d="M6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1a10 10 0 0 0 0 9.2L6.4 14z"/><path fill="#EA4335" d="M12 6c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.4L6.4 10C7.2 7.7 9.4 6 12 6z"/></svg>
      </span>
      <span class="flex-1 text-left text-[17px] leading-tight">Laisser un avis 5&nbsp;étoiles</span>
      <svg class="h-5 w-5 transition group-hover:translate-x-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
    <p class="mt-2 text-center text-xs text-slate-400">Prend moins de 15 secondes, sans inscription</p>

    <!-- 3. Boutons secondaires -->
    <button id="vcf" type="button" class="mt-6 flex w-full items-center justify-center gap-2 rounded-2xl border border-slate-800 bg-slate-800/60 px-3 py-4 font-semibold transition hover:bg-slate-800 active:scale-[.98]">
      <svg class="h-5 w-5 shrink-0 text-sky-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="8" r="4"/><path d="M2 21a8 8 0 0 1 16 0M19 8v6M16 11h6"/></svg>
      <span id="vcfTxt" class="whitespace-nowrap text-[15px]">Enregistrer dans mes contacts</span>
    </button>

    <div class="mt-3 grid grid-cols-2 gap-3">
      <a id="call" href="#" class="btn2"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>Appeler</a>
      <a id="web" href="#" target="_blank" rel="noopener" class="btn2"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>Site Web</a>
      <a id="insta" href="#" target="_blank" rel="noopener" class="btn2"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".8"/></svg>Instagram</a>
      <a id="mail" href="#" class="btn2"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>E-mail</a>
    </div>
  </section>

  <!-- 4. Pied de page -->
  <footer class="mt-6 text-center text-[11px] text-slate-500">
    Propulsé par <a href="https://malo-oneweb.surge.sh/" target="_blank" rel="noopener" class="text-slate-400 underline-offset-2 hover:underline">OneWeb Review</a>
  </footer>
</main>

<div id="toast" role="status" class="pointer-events-none fixed inset-x-4 bottom-6 mx-auto max-w-sm translate-y-24 rounded-2xl bg-white px-4 py-3 text-center text-sm font-medium text-slate-900 opacity-0 shadow-2xl transition duration-300"></div>

<script>
/* ========= DONNÉES CLIENT (à modifier pour chaque client) ========= */
var C = {
  name: 'Malo OneWeb',
  activity: 'Accompagnement web & solutions digitales',
  tel: '+33777788562',
  email: 'malo.oneweb@gmail.com',
  web: 'https://malo-oneweb.surge.sh/',
  insta: 'https://www.instagram.com/malo.oneweb',
  region: 'Occitanie',
  gbp: 'https://share.google/DD7uOuEbsURMxU5QQ',   // fiche Google Business (lien de partage)
  placeId: '[PLACE_ID_A_RENSEIGNER]',              // si renseigné : ouvre directement la fenêtre "Écrire un avis"
  rating: null,   // VALEUR PROVISOIRE À REMPLACER, ex. 4.9  (null = note masquée)
  count: null     // VALEUR PROVISOIRE À REMPLACER, ex. 27   (null = nombre masqué)
};
/* ================================================================= */
var $ = function (id) { return document.getElementById(id); };
var hasPlace = C.placeId && C.placeId.charAt(0) !== '[';
var reviewUrl = hasPlace ? 'https://search.google.com/local/writereview?placeid=' + encodeURIComponent(C.placeId) : C.gbp;
$('review').href = reviewUrl;
$('badge').href = C.gbp;
if (C.rating && C.count) $('badgeTxt').textContent = String(C.rating).replace('.', ',') + ' · ' + C.count + ' avis Google';
$('call').href = 'tel:' + C.tel;
$('web').href = C.web;
$('insta').href = C.insta;
$('mail').href = 'mailto:' + C.email + '?subject=' + encodeURIComponent("Demande par rapport à vos Services d'Accompagnement Web") + '&body=' + encodeURIComponent("Bonjour,\n\nJ'aimerais en savoir plus sur vos services.\n\n");

function toast(msg) {
  var t = $('toast'); t.textContent = msg;
  t.classList.remove('translate-y-24', 'opacity-0');
  clearTimeout(t._h); t._h = setTimeout(function () { t.classList.add('translate-y-24', 'opacity-0'); }, 2600);
}

$('vcf').addEventListener('click', function () {
  var e = function (s) { return s.replace(/[\\,;]/g, '\\$&'); };
  var v = [
    'BEGIN:VCARD', 'VERSION:3.0',
    'N:;' + e(C.name) + ';;;', 'FN:' + e(C.name), 'ORG:' + e(C.name), 'TITLE:' + e(C.activity),
    'TEL;TYPE=CELL,VOICE:' + C.tel, 'EMAIL;TYPE=INTERNET:' + C.email,
    'URL:' + C.web, 'X-SOCIALPROFILE;TYPE=instagram:' + C.insta,
    'ADR;TYPE=WORK:;;;;' + e(C.region) + ';;France',
    'PHOTO;ENCODING=b;TYPE=JPEG:__PHOTO__',
    'END:VCARD'
  ].join('\r\n');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([v], { type: 'text/vcard;charset=utf-8' }));
  a.download = 'Malo-OneWeb.vcf';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  toast('Fiche contact téléchargée : ouvrez-la pour l’ajouter ✓');
});
</script>
</body>
</html>
