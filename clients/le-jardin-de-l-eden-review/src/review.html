<!doctype html>
<html lang="fr" class="bg-slate-950">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Le Jardin de l’Eden · Avis & contact</title>
<meta name="description" content="Laissez un avis Google au Jardin de l’Eden à Noé, enregistrez le contact du restaurant ou appelez-le en un clic.">
<meta name="theme-color" content="#020617">
<meta name="robots" content="noindex">
__ICONS__
<style>__CSS__</style>
</head>
<body class="min-h-screen bg-slate-950 text-white antialiased font-sans">
<div class="glow" aria-hidden="true"></div>
<main class="relative mx-auto flex min-h-screen max-w-sm flex-col justify-center px-4 py-8">
  <section class="rise rounded-3xl border border-slate-800 bg-slate-900 p-6 shadow-2xl shadow-black/60">

    <!-- 1. En-tête -->
    <header class="text-center">
      <div class="pop mx-auto mb-4 grid h-24 w-24 place-items-center rounded-full bg-gradient-to-br from-red-800 to-amber-500 p-[3px]">
        <div class="grid h-full w-full place-items-center rounded-full bg-slate-950">
          <span class="font-serif text-3xl italic tracking-tight text-amber-100" aria-hidden="true">JE</span>
        </div>
      </div>
      <h1 style="--d:.15s" class="in text-2xl font-bold tracking-tight">Le Jardin de l’Eden</h1>
      <p style="--d:.22s" class="in mt-1 text-sm text-slate-400">Bistrot · Noé (31) · Petit-déjeuner &amp; déjeuner</p>
      <a id="badge" href="#" target="_blank" rel="noopener" style="--d:.3s" class="in mt-4 inline-flex items-center gap-2 rounded-full border border-slate-800 bg-slate-950/60 px-3 py-1.5 text-xs text-slate-300">
        <span class="stars text-amber-400 tracking-[2px]" aria-hidden="true"><i>★</i><i>★</i><i>★</i><i>★</i><i>★</i></span>
        <span id="badgeTxt">Avis Google</span>
      </a>
    </header>

    <!-- 2. CTA principal -->
    <a id="review" href="#" target="_blank" rel="noopener" style="--d:.42s" class="in tap cta group mt-6 flex items-center gap-3 rounded-2xl bg-gradient-to-r from-red-800 to-orange-600 p-4 font-semibold shadow-lg shadow-red-900/40 transition active:scale-[.98]">
      <span class="grid h-10 w-10 shrink-0 place-items-center rounded-full bg-white">
        <svg class="h-5 w-5" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3z"/><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z"/><path fill="#FBBC05" d="M6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1a10 10 0 0 0 0 9.2L6.4 14z"/><path fill="#EA4335" d="M12 6c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.4L6.4 10C7.2 7.7 9.4 6 12 6z"/></svg>
      </span>
      <span class="flex-1 text-left text-[17px] leading-tight">Laisser un avis</span>
      <svg class="h-5 w-5 transition group-hover:translate-x-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
    <p style="--d:.5s" class="in mt-2 text-center text-xs text-slate-400">Prend moins de 15 secondes, sans inscription</p>

    <!-- 3. Boutons secondaires -->
    <a id="vcf" href="Le-Jardin-de-l-Eden.vcf" type="text/vcard" style="--d:.58s" class="in tap relative overflow-hidden mt-6 flex w-full items-center justify-center gap-2 rounded-2xl border border-slate-800 bg-slate-800/60 px-3 py-4 font-semibold transition hover:bg-slate-800 active:scale-[.98]">
      <svg class="h-5 w-5 shrink-0 text-amber-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="8" r="4"/><path d="M2 21a8 8 0 0 1 16 0M19 8v6M16 11h6"/></svg>
      <span id="vcfTxt" class="whitespace-nowrap text-[15px]">Enregistrer dans mes contacts</span>
    </a>

    <div class="mt-3 grid grid-cols-2 gap-3">
      <a id="call" href="#" style="--d:.66s" class="in btn2"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>Appeler</a>
      <a id="web" href="#" target="_blank" rel="noopener" style="--d:.72s" class="in btn2"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>Site Web</a>
      <a id="fb" href="#" target="_blank" rel="noopener" style="--d:.78s" class="in btn2"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 8h3V4h-3a4 4 0 0 0-4 4v3H7v4h3v6h4v-6h3l1-4h-4V8z"/></svg>Facebook</a>
      <a id="map" href="#" target="_blank" rel="noopener" style="--d:.84s" class="in btn2"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>Itinéraire</a>
    </div>
  </section>

  <!-- 4. Pied de page -->
  <footer style="--d:1s" class="in mt-6 text-center text-[11px] text-slate-500">
    Propulsé par <a href="https://www.malo-oneweb.fr/" target="_blank" rel="noopener" class="text-slate-400 underline-offset-2 hover:underline">OneWeb Review</a>
  </footer>
</main>

<div id="toast" role="status" class="pointer-events-none fixed inset-x-4 bottom-6 mx-auto max-w-sm translate-y-24 rounded-2xl bg-white px-4 py-3 text-center text-sm font-medium text-slate-900 opacity-0 shadow-2xl transition duration-300"></div>

<script>
/* ========= DONNÉES CLIENT (à modifier pour chaque client) ========= */
var C = {
  name: 'Le Jardin de l’Eden',
  activity: 'Bistrot · Petit-déjeuner et déjeuner',
  tel: '+33561907482',
  web: 'https://le-jardin-de-l-eden.surge.sh/',
  facebook: 'https://www.facebook.com/LeBistrotdeleden/',
  street: 'Chemin de la Maladrerie',
  zip: '31410',
  city: 'Noé',
  geo: '43.3451677,1.2638447',
  gbp: 'https://share.google/Ieo4m4y3xoHL3FLzd',   // lien vers les avis Google (fiche Google Business)
  placeId: '[PLACE_ID_A_RENSEIGNER]',              // si renseigné : ouvre directement la fenêtre "Écrire un avis"
  rating: null,   // VALEUR PROVISOIRE À REMPLACER, ex. 4.6  (null = note masquée)
  count: null     // VALEUR PROVISOIRE À REMPLACER, ex. 120  (null = nombre masqué)
};
/* ================================================================= */
var $ = function (id) { return document.getElementById(id); };
var hasPlace = C.placeId && C.placeId.charAt(0) !== '[';
var reviewUrl = hasPlace ? 'https://search.google.com/local/writereview?placeid=' + encodeURIComponent(C.placeId) : C.gbp;
$('review').href = reviewUrl;
$('badge').href = C.gbp;
if (C.rating && C.count) $('badgeTxt').textContent = String(C.rating).replace('.', ',') + ' · ' + C.count + ' avis Google';
$('call').href = 'tel:' + C.tel;
$('web').href = C.web;
$('fb').href = C.facebook;
$('map').href = 'https://www.google.com/maps/dir/?api=1&destination=' + C.geo;

// Effet d'onde au clic sur les boutons
document.querySelectorAll('.tap,.btn2').forEach(function (el) {
  el.addEventListener('pointerdown', function (ev) {
    var r = el.getBoundingClientRect(), d = Math.max(r.width, r.height), w = document.createElement('span');
    w.className = 'wave'; w.style.width = w.style.height = d + 'px';
    w.style.left = ev.clientX - r.left - d / 2 + 'px'; w.style.top = ev.clientY - r.top - d / 2 + 'px';
    el.appendChild(w); setTimeout(function () { w.remove(); }, 650);
  });
});

function toast(msg) {
  var t = $('toast'); t.textContent = msg;
  t.classList.remove('translate-y-24', 'opacity-0');
  clearTimeout(t._h); t._h = setTimeout(function () { t.classList.add('translate-y-24', 'opacity-0'); }, 2600);
}

// La fiche .vcf est un vrai fichier publié à côté de la page (généré par build.sh) :
// iPhone l'ouvre directement dans Contacts, Android la télécharge et propose « Ouvrir » -> Importer.
$('vcf').addEventListener('click', function () {
  var b = $('vcf'), t = $('vcfTxt'), android = /Android/i.test(navigator.userAgent);
  b.classList.add('ok'); t.textContent = 'Ouverture de la fiche contact ✓';
  setTimeout(function () { b.classList.remove('ok'); t.textContent = 'Enregistrer dans mes contacts'; }, 2600);
  toast(android ? 'Touchez « Ouvrir » puis « Importer »' : 'Touchez « Créer un nouveau contact »');
});
</script>
</body>
</html>
